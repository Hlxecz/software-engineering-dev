name: Assignment 4 unit cases

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-cases:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Run 35 class test cases
        run: npm run test:assignment4
      - name: Check assignment documents
        run: node tools/check-docs.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: assignment4-results-${{ matrix.os }}
          path: output/assignment4/results.json
          if-no-files-found: warn
