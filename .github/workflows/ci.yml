name: Windows checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - run: npm run setup
      - run: npm run release:check
      - name: Validate Windows launcher scripts
        shell: pwsh
        run: |
          $scripts = @('Start-App.ps1') + @(Get-ChildItem windows/*.ps1 | ForEach-Object FullName)
          foreach ($script in $scripts) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script).Path, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
          }
      - run: npm test
      - name: Check current design and preserved assignment artifacts
        run: node tools/windows-upgrade/check.mjs
      - run: npm run test:desktop
      - run: npm run test:categories
      - run: npm run test:writing
      - run: npm run test:setup
      - run: npm run test:account
      - run: npm run test:refine
      - run: npm run test:existing
      - run: npm run test:lifecycle
