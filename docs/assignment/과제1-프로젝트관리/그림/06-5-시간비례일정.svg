<rect x="314" y="475" width="6" height="26" rx="2" fill="#ac7841" data-group="9" data-start="38" data-end="40"/>
<rect x="434" y="475" width="6" height="26" rx="2" fill="#ac7841" data-group="9" data-start="78" data-end="80"/>
<rect x="554" y="475" width="6" height="26" rx="2" fill="#ac7841" data-group="9" data-start="118" data-end="120"/>
<rect x="674" y="475" width="6" height="26" rx="2" fill="#ac7841" data-group="9" data-start="158" data-end="160"/>
<text x="820" y="493" font-size="16">4회 × 2 h</text>
