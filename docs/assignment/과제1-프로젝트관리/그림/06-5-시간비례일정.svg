<rect x="776" y="555" width="24" height="26" rx="2" fill="#ccd4dc" data-group="unallocated" data-start="192" data-end="200"/>
<text x="788" y="573" text-anchor="middle" font-size="14" fill="#183650">8</text>
<text x="820" y="573" font-size="16">192–200 h</text>
<text x="20" y="640" font-size="16">관리 구간: 38–40 / 78–80 / 118–120 / 158–160 h</text><text x="20" y="669" font-size="16">경계 분할: 3.2: 32–38 / 40–44 h · 4.3: 76–78 / 80–84 h · 6.3: 114–118 / 120–122 h</text><text x="20" y="708" font-size="16">기준 160 h + 예비 32 h = 계획 192 h / 미배정 8 h와 별도</text><text x="20" y="742" font-size="15">예비 구간은 확보 용량 표시이며, 위험 발생 시 필요한 시점에 사용하고 후속 일정을 조정한다.</text></g></svg>