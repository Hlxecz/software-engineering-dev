<rect x="680" y="515" width="96" height="26" rx="2" fill="#dba642" data-group="reserve" data-start="160" data-end="192"/>
<text x="728" y="533" text-anchor="middle" font-size="14" fill="white">32</text>
<text x="820" y="533" font-size="16">160–192 h</text>
