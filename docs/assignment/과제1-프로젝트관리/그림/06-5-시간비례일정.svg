<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="780" viewBox="0 0 1020 780" role="img" aria-labelledby="title desc" style="max-width: none;"><title id="title">1인 시간 배분: 200시간 / 10주</title><desc id="desc">기준 160시간, 위험 예비 32시간, 미배정 8시간. 모든 배분은 시간 축에서 겹치지 않는다.</desc><rect width="1020" height="780" fill="white"/><g font-family="Malgun Gothic, sans-serif" fill="#1c344e"><text x="20" y="30" font-size="21" font-weight="700">누적 시간에 비례한 1인 구축 일정</text><text x="20" y="60" font-size="16">주 20 h · 10주 200 h / 행은 업무 종류, 막대는 순차 배분</text>
<text x="135" y="95" font-size="15">상대 주</text><text x="138" y="119" font-size="15">시간 h</text>
<line x1="200" y1="130" x2="200" y2="595" stroke="#dce4ec"/><text x="200" y="95" text-anchor="middle" font-size="15">0</text><text x="200" y="119" text-anchor="middle" font-size="15">0</text>
<line x1="260" y1="130" x2="260" y2="595" stroke="#dce4ec"/><text x="260" y="95" text-anchor="middle" font-size="15">1</text><text x="260" y="119" text-anchor="middle" font-size="15">20</text>
<line x1="320" y1="130" x2="320" y2="595" stroke="#dce4ec"/><text x="320" y="95" text-anchor="middle" font-size="15">2</text><text x="320" y="119" text-anchor="middle" font-size="15">40</text>
<line x1="380" y1="130" x2="380" y2="595" stroke="#dce4ec"/><text x="380" y="95" text-anchor="middle" font-size="15">3</text><text x="380" y="119" text-anchor="middle" font-size="15">60</text>
<line x1="440" y1="130" x2="440" y2="595" stroke="#dce4ec"/><text x="440" y="95" text-anchor="middle" font-size="15">4</text><text x="440" y="119" text-anchor="middle" font-size="15">80</text>
<line x1="500" y1="130" x2="500" y2="595" stroke="#dce4ec"/><text x="500" y="95" text-anchor="middle" font-size="15">5</text><text x="500" y="119" text-anchor="middle" font-size="15">100</text>
<line x1="560" y1="130" x2="560" y2="595" stroke="#dce4ec"/><text x="560" y="95" text-anchor="middle" font-size="15">6</text><text x="560" y="119" text-anchor="middle" font-size="15">120</text>
<line x1="620" y1="130" x2="620" y2="595" stroke="#dce4ec"/><text x="620" y="95" text-anchor="middle" font-size="15">7</text><text x="620" y="119" text-anchor="middle" font-size="15">140</text>
<line x1="680" y1="130" x2="680" y2="595" stroke="#dce4ec"/><text x="680" y="95" text-anchor="middle" font-size="15">8</text><text x="680" y="119" text-anchor="middle" font-size="15">160</text>
<line x1="740" y1="130" x2="740" y2="595" stroke="#dce4ec"/><text x="740" y="95" text-anchor="middle" font-size="15">9</text><text x="740" y="119" text-anchor="middle" font-size="15">180</text>
<line x1="800" y1="130" x2="800" y2="595" stroke="#dce4ec"/><text x="800" y="95" text-anchor="middle" font-size="15">10</text><text x="800" y="119" text-anchor="middle" font-size="15">200</text>
<text x="16" y="173" font-size="16">1. 요구·범위 분석 · 12 h</text>
