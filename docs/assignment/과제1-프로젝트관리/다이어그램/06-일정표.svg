<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="550" viewBox="0 0 1260 550"><rect width="1260" height="550" fill="white"/><style>text{font-family:Apple SD Gothic Neo,Malgun Gothic,sans-serif;fill:#172e43}.grid{stroke:#dce4eb;stroke-width:1}</style><text x="30" y="40" font-size="24" font-weight="bold">프로젝트 상대 일정 · 기준 200 h + 위험 예비 40 h</text><text x="30" y="70" font-size="16">1명 · 주 20 h · 계획 용량 12주 / 막대 길이는 시간에 비례</text><line x1="330.0" y1="120" x2="330.0" y2="480" class="grid"/><text x="330.0" y="110" text-anchor="middle" font-size="15">0주</text><line x1="403.0" y1="120" x2="403.0" y2="480" class="grid"/><text x="403.0" y="110" text-anchor="middle" font-size="15">1주</text><line x1="476.0" y1="120" x2="476.0" y2="480" class="grid"/><text x="476.0" y="110" text-anchor="middle" font-size="15">2주</text><line x1="549.0" y1="120" x2="549.0" y2="480" class="grid"/><text x="549.0" y="110" text-anchor="middle" font-size="15">3주</text><line x1="622.0" y1="120" x2="622.0" y2="480" class="grid"/><text x="622.0" y="110" text-anchor="middle" font-size="15">4주</text><line x1="695.0" y1="120" x2="695.0" y2="480" class="grid"/><text x="695.0" y="110" text-anchor="middle" font-size="15">5주</text><line x1="768.0" y1="120" x2="768.0" y2="480" class="grid"/><text x="768.0" y="110" text-anchor="middle" font-size="15">6주</text><line x1="841.0" y1="120" x2="841.0" y2="480" class="grid"/><text x="841.0" y="110" text-anchor="middle" font-size="15">7주</text><line x1="914.0" y1="120" x2="914.0" y2="480" class="grid"/><text x="914.0" y="110" text-anchor="middle" font-size="15">8주</text><line x1="987.0" y1="120" x2="987.0" y2="480" class="grid"/><text x="987.0" y="110" text-anchor="middle" font-size="15">9주</text><line x1="1060.0" y1="120" x2="1060.0" y2="480" class="grid"/><text x="1060.0" y="110" text-anchor="middle" font-size="15">10주</text><line x1="1133.0" y1="120" x2="1133.0" y2="480" class="grid"/><text x="1133.0" y="110" text-anchor="middle" font-size="15">11주</text><line x1="1206.0" y1="120" x2="1206.0" y2="480" class="grid"/><text x="1206.0" y="110" text-anchor="middle" font-size="15">12주</text><text x="30" y="159" font-size="17">1. 프로젝트 분석·관리</text><rect x="330.0" y="135" width="87.6" height="33" rx="5" fill="#436b8e"/><text x="373.8" y="157" text-anchor="middle" font-size="16" style="fill:white">24 h</text><text x="30" y="206" font-size="17">2. 실행 기반·Java 저장</text><rect x="417.6" y="182" width="146.0" height="33" rx="5" fill="#436b8e"/><text x="490.6" y="204" text-anchor="middle" font-size="16" style="fill:white">40 h</text><text x="30" y="253" font-size="17">3. 작성·편집·지침 연결</text><rect x="563.6" y="229" width="146.0" height="33" rx="5" fill="#436b8e"/><text x="636.5999999999999" y="251" text-anchor="middle" font-size="16" style="fill:white">40 h</text><text x="30" y="300" font-size="17">4. AI·블로그 연동</text><rect x="709.5999999999999" y="276" width="146.0" height="33" rx="5" fill="#436b8e"/><text x="782.5999999999999" y="298" text-anchor="middle" font-size="16" style="fill:white">40 h</text><text x="30" y="347" font-size="17">5. 통합·보존·사용자 검증</text><rect x="855.6" y="323" width="116.8" height="33" rx="5" fill="#436b8e"/><text x="914.0" y="345" text-anchor="middle" font-size="16" style="fill:white">32 h</text><text x="30" y="394" font-size="17">6. 배포·문서·인수</text><rect x="972.4" y="370" width="87.6" height="33" rx="5" fill="#436b8e"/><text x="1016.1999999999999" y="392" text-anchor="middle" font-size="16" style="fill:white">24 h</text><text x="30" y="441" font-size="17">위험 예비</text><rect x="1060.0" y="417" width="146.0" height="33" rx="5" fill="#b88b43"/><text x="1133.0" y="439" text-anchor="middle" font-size="16" style="fill:white">40 h</text><text x="30" y="515" font-size="16">예비는 필요한 시점에 배분하며 실제 마감일이 정해지면 달력 일정으로 변환한다.</text></svg>