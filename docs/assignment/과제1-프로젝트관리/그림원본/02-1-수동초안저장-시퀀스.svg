<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="1610" viewBox="0 0 1060 1610" role="img"><title>UC-08/09 · 수동 초안 보관 시퀀스</title><defs><marker id="open-arrow" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11" fill="none" stroke="#37516d" stroke-width="1.5"/></marker><marker id="triangle" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto"><path d="M1 1 L13 7 L1 13 Z" fill="white" stroke="#37516d" stroke-width="1.5"/></marker></defs><rect width="1060" height="1610" fill="white"/><g font-family="Malgun Gothic, sans-serif" fill="#17263c" stroke-width="1.6"><text x="35" y="40" font-size="28" text-anchor="start"><tspan x="35" dy="0">UC-08/09 · 수동 초안 보관 시퀀스</tspan></text><text x="35" y="75" font-size="23" text-anchor="start"><tspan x="35" dy="0">재료 저장·초안 구성 뒤 /draft 요청부터 표시; 선행 재료 PUT·목록 갱신 생략</tspan></text><g data-participant="사용자"><rect x="10" y="112" width="130" height="76" fill="#edf3f8" stroke="#37516d"/><text x="75" y="143" font-size="23" text-anchor="middle"><tspan x="75" dy="0">사용자</tspan></text><path d="M75 188V1440" fill="none" stroke="#597086" stroke-dasharray="6 5"/></g><g data-participant="화면 JS"><rect x="145" y="112" width="130" height="76" fill="#edf3f8" stroke="#37516d"/><text x="210" y="143" font-size="23" text-anchor="middle"><tspan x="210" dy="0">화면 JS</tspan></text><path d="M210 188V1440" fill="none" stroke="#597086" stroke-dasharray="6 5"/></g><g data-participant="Node API"><rect x="320" y="112" width="130" height="76" fill="#edf3f8" stroke="#37516d"/><text x="385" y="143" font-size="23" text-anchor="middle"><tspan x="385" dy="0">Node API</tspan></text><path d="M385 188V1440" fill="none" stroke="#597086" stroke-dasharray="6 5"/></g><g data-participant="javaStore"><rect x="485" y="112" width="130" height="76" fill="#edf3f8" stroke="#37516d"/><text x="550" y="143" font-size="23" text-anchor="middle"><tspan x="550" dy="0">javaStore</tspan><tspan x="550" dy="1.35em">Node 모듈</tspan></text><path d="M550 188V1440" fill="none" stroke="#597086" stroke-dasharray="6 5"/></g><g data-participant="요청별 JVM"><rect x="690" y="112" width="130" height="76" fill="#edf3f8" stroke="#37516d"/><text x="755" y="143" font-size="23" text-anchor="middle"><tspan x="755" dy="0">요청별 JVM</tspan><tspan x="755" dy="1.35em">Main / 저장 클래스</tspan></text><path d="M755 188V1440" fill="none" stroke="#597086" stroke-dasharray="6 5"/></g><g data-participant="전용 파일"><rect x="915" y="112" width="130" height="76" fill="#edf3f8" stroke="#37516d"/><text x="980" y="143" font-size="23" text-anchor="middle"><tspan x="980" dy="0">전용 파일</tspan></text><path d="M980 188V1440" fill="none" stroke="#597086" stroke-dasharray="6 5"/></g><path d="M75 235H210" fill="none" stroke="#597086" marker-end="url(#open-arrow)"  /><text x="142.5" y="226" font-size="24" text-anchor="middle"><tspan x="142.5" dy="0">보관 클릭</tspan></text><path d="M210 285H385" fill="none" stroke="#597086" marker-end="url(#open-arrow)"  /><text x="297.5" y="276" font-size="24" text-anchor="middle"><tspan x="297.5" dy="0">PUT /api/jobs/id/draft</tspan></text><path d="M385 335H550" fill="none" stroke="#597086" marker-end="url(#open-arrow)"  data-operation="job.meta,job.directory"/><text x="467.5" y="326" font-size="24" text-anchor="middle"><tspan x="467.5" dy="0">job.meta → job.directory</tspan></text><path d="M550 385H755" fill="none" stroke="#597086" marker-end="url(#open-arrow)"  /><text x="652.5" y="376" font-size="24" text-anchor="middle"><tspan x="652.5" dy="0">조회 작업마다 별도 JVM</tspan></text><path d="M755 435H980" fill="none" stroke="#597086" marker-end="url(#open-arrow)"  /><text x="690" y="426" font-size="24" text-anchor="middle"><tspan x="690" dy="0">메타·사본 경로 읽기</tspan></text><path d="M755 480H550" fill="none" stroke="#597086" marker-end="url(#open-arrow)" stroke-dasharray="7 5" /><text x="652.5" y="471" font-size="24" text-anchor="middle"><tspan x="652.5" dy="0">JSON 결과 / 작업별 종료</tspan></text><path d="M550 525H385" fill="none" stroke="#597086" marker-end="url(#open-arrow)" stroke-dasharray="7 5" /><text x="467.5" y="516" font-size="24" text-anchor="middle"><tspan x="467.5" dy="0">기존 directory 또는 없음</tspan></text><rect x="300" y="548" width="738" height="233" fill="none" stroke="#597086"/><text x="315" y="575" font-size="22" text-anchor="start"><tspan x="315" dy="0">opt  기존 입력 사본이 없을 때만 prepare(id)</tspan></text><path d="M385 620H550" fill="none" stroke="#597086" marker-end="url(#open-arrow)"  data-operation="job.ready,job.prepare,job.meta.save"/><text x="467.5" y="611" font-size="24" text-anchor="middle"><tspan x="467.5" dy="0">job.ready → job.prepare → job.meta.save</tspan></text><path d="M550 665H755" fill="none" stroke="#597086" marker-end="url(#open-arrow)"  /><text x="652.5" y="656" font-size="24" text-anchor="middle"><tspan x="652.5" dy="0">순서대로 3회 · 각각 새 JVM</tspan></text><path d="M755 710H980" fill="none" stroke="#597086" marker-end="url(#open-arrow)"  /><text x="690" y="701" font-size="24" text-anchor="middle"><tspan x="690" dy="0">사진 ≥ 1 · 입력 사본 준비·연결 저장</tspan></text><path d="M755 755H550" fill="none" stroke="#597086" marker-end="url(#open-arrow)" stroke-dasharray="7 5" /><text x="652.5" y="746" font-size="24" text-anchor="middle"><tspan x="652.5" dy="0">작업별 결과 / 종료</tspan></text><path d="M385 806H445V830H385" fill="none" stroke="#597086" marker-end="url(#open-arrow)"/><text x="655" y="824" font-size="24" text-anchor="middle"><tspan x="655" dy="0">JS: 검토 메모·본문·카드·표지·해시 검사</tspan></text><path d="M385 890H550" fill="none" stroke="#597086" marker-end="url(#open-arrow)"  data-operation="draft.save"/><text x="467.5" y="881" font-size="24" text-anchor="middle"><tspan x="467.5" dy="0">draft.save</tspan></text><path d="M550 937H755" fill="none" stroke="#597086" marker-end="url(#open-arrow)"  /><text x="652.5" y="928" font-size="24" text-anchor="middle"><tspan x="652.5" dy="0">새 JVM · Main → DraftRepository.save</tspan></text><path d="M755 984H980" fill="none" stroke="#597086" marker-end="url(#open-arrow)"  /><text x="690" y="975" font-size="24" text-anchor="middle"><tspan x="690" dy="0">경로·ID·분류·해시 검사 / 이력·초안 저장</tspan></text><path d="M755 1031H550" fill="none" stroke="#597086" marker-end="url(#open-arrow)" stroke-dasharray="7 5" /><text x="652.5" y="1022" font-size="24" text-anchor="middle"><tspan x="652.5" dy="0">ok true / 거부·쓰기 실패는 ok false</tspan></text><path d="M550 1078H385" fill="none" stroke="#597086" marker-end="url(#open-arrow)" stroke-dasharray="7 5" /><text x="467.5" y="1069" font-size="24" text-anchor="middle"><tspan x="467.5" dy="0">성공 result / 실패는 예외</tspan></text><path d="M385 1140H980" fill="none" stroke="#597086" marker-end="url(#open-arrow)"  data-operation="renderDraft"/><text x="682.5" y="1100" font-size="24" text-anchor="middle"><tspan x="682.5" dy="0">저장 성공 때 renderDraft</tspan><tspan x="682.5" dy="1.35em">preview.html / render.json (JS 파일 쓰기)</tspan></text><path d="M385 1190H550" fill="none" stroke="#597086" marker-end="url(#open-arrow)"  data-operation="job.read"/><text x="467.5" y="1181" font-size="24" text-anchor="middle"><tspan x="467.5" dy="0">렌더 성공 때 job.read</tspan></text><path d="M550 1235H755" fill="none" stroke="#597086" marker-end="url(#open-arrow)"  /><text x="652.5" y="1226" font-size="24" text-anchor="middle"><tspan x="652.5" dy="0">새 JVM · Main → JobRepository.read</tspan></text><path d="M755 1280H980" fill="none" stroke="#597086" marker-end="url(#open-arrow)"  /><text x="690" y="1271" font-size="24" text-anchor="middle"><tspan x="690" dy="0">저장 자료 읽기</tspan></text><path d="M755 1325H550" fill="none" stroke="#597086" marker-end="url(#open-arrow)" stroke-dasharray="7 5" /><text x="652.5" y="1316" font-size="24" text-anchor="middle"><tspan x="652.5" dy="0">JSON 결과 / 종료</tspan></text><path d="M550 1370H385" fill="none" stroke="#597086" marker-end="url(#open-arrow)" stroke-dasharray="7 5" /><text x="467.5" y="1361" font-size="24" text-anchor="middle"><tspan x="467.5" dy="0">읽은 자료</tspan></text><path d="M385 1415H210" fill="none" stroke="#597086" marker-end="url(#open-arrow)" stroke-dasharray="7 5" /><text x="297.5" y="1406" font-size="24" text-anchor="middle"><tspan x="297.5" dy="0">전체 완료: HTTP 결과 / 화면 갱신</tspan></text><rect x="30" y="1465" width="1000" height="118" fill="#f3f5f7" stroke="#d7dee7"/><text x="48" y="1494" font-size="22" text-anchor="start"><tspan x="48" dy="0">오류: JS 검증 거부·Java 오류·파일 쓰기 실패는 성공 대신 오류 응답으로 전달한다.</tspan><tspan x="48" dy="1.35em">Java 실패 뒤에는 렌더/재조회를 진행하지 않는다. 쓰기 실패는 부분 반영 가능하다.</tspan><tspan x="48" dy="1.35em">Java 저장 후 renderDraft/job.read 실패는 이미 저장한 초안을 자동 복원하지 않는다.</tspan></text></g></svg>
