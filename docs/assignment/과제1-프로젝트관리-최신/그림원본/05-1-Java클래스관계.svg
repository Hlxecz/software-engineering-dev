<svg xmlns="http://www.w3.org/2000/svg" width="1070" height="960" viewBox="0 0 1070 960" role="img"><title>기능별 Java 구조: 클래스 17개와 인터페이스 2개</title><rect width="1070" height="960" fill="white"/><g font-family="Malgun Gothic,sans-serif" fill="#163250"><text x="30" y="42" font-size="28" font-weight="700">기능별 Java 구조 · 총 19개 선언</text><text x="30" y="75" font-size="20">클래스 17개 / 실제 저장 계약인 인터페이스 2개</text><rect x="30" y="100" width="480" height="155" rx="8" fill="#f3f7fc" stroke="#6b87a4" stroke-width="2"/><text x="50" y="136" font-size="22" font-weight="700">bridge · 요청 진입과 분배</text><line x1="30" y1="152" x2="510" y2="152" stroke="#bccbd9"/><text x="54" y="188" font-size="22">Main</text><text x="54" y="230" font-size="22">RequestDispatcher</text><rect x="30" y="295" width="480" height="460" rx="8" fill="#f3f7fc" stroke="#6b87a4" stroke-width="2"/><text x="50" y="331" font-size="22" font-weight="700">post · 글과 새 저장 기능</text><line x1="30" y1="347" x2="510" y2="347" stroke="#bccbd9"/><text x="54" y="383" font-size="22">JobRepository</text><text x="54" y="425" font-size="22">SnapshotService</text><text x="54" y="467" font-size="22">DraftRepository</text><text x="54" y="509" font-size="22" font-style="italic" fill="#7b4a2e">DraftStore «interface»</text><text x="54" y="551" font-size="22">StorageService</text><text x="54" y="593" font-size="22">ExistingPostService</text><text x="54" y="635" font-size="22">RefinementService</text><text x="54" y="677" font-size="22">UpdateService</text><rect x="560" y="100" width="480" height="330" rx="8" fill="#f3f7fc" stroke="#6b87a4" stroke-width="2"/><text x="580" y="136" font-size="22" font-weight="700">common · 공통 저장과 복원</text><line x1="560" y1="152" x2="1040" y2="152" stroke="#bccbd9"/><text x="584" y="188" font-size="22">AppException</text><text x="584" y="230" font-size="22">JsonFiles</text><text x="584" y="272" font-size="22" font-style="italic" fill="#7b4a2e">JsonRecordStore «interface»</text><text x="584" y="314" font-size="22">FileJsonRecordStore</text><text x="584" y="356" font-size="22">FileTransaction</text><rect x="560" y="470" width="480" height="120" rx="8" fill="#f3f7fc" stroke="#6b87a4" stroke-width="2"/><text x="580" y="506" font-size="22" font-weight="700">workspace · 자료 경로</text><line x1="560" y1="522" x2="1040" y2="522" stroke="#bccbd9"/><text x="584" y="558" font-size="22">Workspace</text><rect x="30" y="795" width="480" height="120" rx="8" fill="#f3f7fc" stroke="#6b87a4" stroke-width="2"/><text x="50" y="831" font-size="22" font-weight="700">category · 카테고리</text><line x1="30" y1="847" x2="510" y2="847" stroke="#bccbd9"/><text x="54" y="883" font-size="22">CategoryService</text><rect x="560" y="630" width="480" height="160" rx="8" fill="#f3f7fc" stroke="#6b87a4" stroke-width="2"/><text x="580" y="666" font-size="22" font-weight="700">prompt · 기본·분류별 지침</text><line x1="560" y1="682" x2="1040" y2="682" stroke="#bccbd9"/><text x="584" y="718" font-size="22">PromptService</text><text x="584" y="760" font-size="22">StyleService</text><text x="560" y="850" font-size="20">«interface» = 구현을 교체할 수 있는 저장 계약</text><text x="560" y="882" font-size="20">책임이 다른 기능만 분리하고</text><text x="560" y="912" font-size="20">기존 공통 처리와 간단한 구조는 유지</text></g></svg>